<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIPAM SULTRA - Aplikasi Pengaduan Masyarakat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .gradient-text { background: linear-gradient(90deg, #38bdf8, #818cf8, #c084fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .btn-primary { background: linear-gradient(90deg, #38bdf8, #818cf8); transition: all 0.3s ease; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 15px -3px rgba(56, 189, 248, 0.4); }
    </style>
</head>
<body class="overflow-x-hidden">

    <!-- Navbar -->
    <nav class="fixed top-0 w-full z-50 glass border-b border-white/10 px-6 py-4 flex justify-between items-center">
        <div class="text-2xl font-bold tracking-tighter gradient-text uppercase">SIPAM SULTRA</div>
        <div id="nav-auth">
            <button onclick="toggleModal('login-modal')" class="bg-white/10 px-5 py-2 rounded-full text-sm font-bold border border-white/20">Admin Login</button>
        </div>
    </nav>

    <!-- UI Pengguna -->
    <main id="user-view" class="pt-24 min-h-screen">
        <section class="flex flex-col justify-center items-center text-center px-4 py-10">
            <h1 class="text-4xl md:text-6xl font-extrabold mb-6 leading-tight">Lapor Cepat, <br> <span class="gradient-text">Respon Akurat.</span></h1>
            <p class="text-slate-400 max-w-xl mb-10">Sampaikan aspirasi dan pengaduan Anda langsung ke Satker terkait di wilayah Sulawesi Tenggara.</p>
            
            <!-- Form Pengaduan -->
            <div class="w-full max-w-2xl glass p-8 rounded-3xl text-left">
                <form id="formAduan" class="space-y-4">
                    <div>
                        <label class="text-xs font-bold text-slate-400 uppercase">Nama Lengkap</label>
                        <input type="text" id="nama" class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 outline-none focus:border-sky-500" required>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="text-xs font-bold text-slate-400 uppercase">Nomor HP/WA</label>
                            <input type="tel" id="hp" class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 outline-none focus:border-sky-500" required>
                        </div>
                        <div>
                            <label class="text-xs font-bold text-slate-400 uppercase">Pilih Satker</label>
                            <select id="satker" class="w-full bg-slate-800 border border-white/10 rounded-xl px-4 py-3 outline-none focus:border-sky-500 text-white">
                                <option value="Kanwil Kemenkumham">Kanwil Kemenkumham Sultra</option>
                                <option value="Lapas Kendari">Lapas Kelas IIA Kendari</option>
                                <option value="Rutan Kendari">Rutan Kelas IIB Kendari</option>
                                <option value="Bapas Kendari">Bapas Kelas II Kendari</option>
                            </select>
                        </div>
                    </div>
                    <div>
                        <label class="text-xs font-bold text-slate-400 uppercase">Isi Aduan</label>
                        <textarea id="isi" rows="4" class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 outline-none focus:border-sky-500" required></textarea>
                    </div>
                    <button type="submit" id="submitBtn" class="btn-primary w-full py-4 rounded-xl font-bold text-lg">Kirim Laporan Sekarang</button>
                </form>
            </div>
        </section>

        <!-- Cek Status -->
        <section class="py-10 px-4 bg-slate-900/50">
            <div class="max-w-md mx-auto text-center">
                <h2 class="text-2xl font-bold mb-4">Cek Status Aduan</h2>
                <div class="flex gap-2">
                    <input type="text" id="ticketInput" placeholder="Contoh: TIC-123456" class="flex-1 bg-white/5 border border-white/10 rounded-xl px-4 py-3 outline-none uppercase">
                    <button onclick="checkTicketStatus()" class="btn-primary px-6 py-3 rounded-xl font-bold">Cari</button>
                </div>
                <div id="statusResult" class="mt-6 hidden"></div>
            </div>
        </section>
    </main>

    <!-- UI Admin -->
    <section id="admin-view" class="hidden min-h-screen pt-24 px-4 pb-10">
        <div class="max-w-6xl mx-auto">
            <div class="flex justify-between items-center mb-8">
                <h2 class="text-3xl font-bold">Panel <span class="gradient-text">Administrator</span></h2>
                <button onclick="handleLogout()" class="bg-red-500/20 text-red-400 border border-red-500/30 px-4 py-2 rounded-xl text-sm font-bold">Logout</button>
            </div>
            <div class="glass rounded-3xl overflow-hidden overflow-x-auto">
                <table class="w-full text-left">
                    <thead class="bg-white/5 border-b border-white/10">
                        <tr>
                            <th class="px-6 py-4 text-xs uppercase text-slate-400">ID Tiket</th>
                            <th class="px-6 py-4 text-xs uppercase text-slate-400">Pelapor</th>
                            <th class="px-6 py-4 text-xs uppercase text-slate-400">Satker</th>
                            <th class="px-6 py-4 text-xs uppercase text-slate-400">Status</th>
                            <th class="px-6 py-4 text-xs uppercase text-slate-400">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="adminTableBody"></tbody>
                </table>
            </div>
        </div>
    </section>

    <!-- Modal Login -->
    <div id="login-modal" class="fixed inset-0 z-[100] hidden items-center justify-center bg-black/80 backdrop-blur-sm p-4">
        <div class="glass w-full max-w-sm p-8 rounded-3xl relative">
            <button onclick="toggleModal('login-modal')" class="absolute top-4 right-4 text-slate-400"><i class="fas fa-times"></i></button>
            <h3 class="text-2xl font-bold text-center mb-6">Admin <span class="gradient-text">Login</span></h3>
            <form id="loginForm" class="space-y-4">
                <input type="email" id="adminEmail" placeholder="Email Admin" class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 outline-none" required>
                <input type="password" id="adminPass" placeholder="Password" class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 outline-none" required>
                <button type="submit" id="loginBtn" class="btn-primary w-full py-3 rounded-xl font-bold">Masuk Ke Panel</button>
            </form>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, doc, getDocs, updateDoc, onSnapshot, serverTimestamp, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // ============================================================
        // PENTING: GANTI DENGAN FIREBASE CONFIG ANDA SENDIRI
        // ============================================================
        const firebaseConfig = {
            apiKey: "AIzaSyDIpXPS1jCMR_FKmF_SSnl3fVvH1eGXJuw",
            authDomain: "sipam-sultra.firebaseapp.com",
            projectId: "sipam-sultra",
            storageBucket: "sipam-sultra.firebasestorage.app",
            messagingSenderId: "188049772880",
            appId: "1:188049772880:web:db1e988e39135045b59c55",
        };

        // Otomatis deteksi lingkungan (Jangan diubah)
        const activeConfig = firebaseConfig.apiKey.includes("SALIN") ? JSON.parse(__firebase_config) : firebaseConfig;
        const app = initializeApp(activeConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'sipam-sultra-app';

        // Pantau Status Login
        onAuthStateChanged(auth, (user) => {
            if (user && user.email) {
                document.getElementById('user-view').classList.add('hidden');
                document.getElementById('admin-view').classList.remove('hidden');
                document.getElementById('nav-auth').innerHTML = `<span class="text-xs font-bold text-sky-400 mr-4">ADMIN AKTIF</span>`;
                loadAdminData();
            } else {
                document.getElementById('user-view').classList.remove('hidden');
                document.getElementById('admin-view').classList.add('hidden');
                document.getElementById('nav-auth').innerHTML = `<button onclick="toggleModal('login-modal')" class="bg-white/10 px-5 py-2 rounded-full text-sm font-bold border border-white/20">Admin Login</button>`;
                if (!user) signInAnonymously(auth);
            }
        });

        // Toggle Modal
        window.toggleModal = (id) => {
            const el = document.getElementById(id);
            el.classList.toggle('hidden');
            el.classList.toggle('flex');
        };

        // Kirim Aduan
        document.getElementById('formAduan').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerText = "Mengirim...";

            const ticketId = 'TIC-' + Math.floor(100000 + Math.random() * 900000);
            const aduanData = {
                ticketId,
                nama: document.getElementById('nama').value,
                hp: document.getElementById('hp').value,
                satker: document.getElementById('satker').value,
                isi: document.getElementById('isi').value,
                status: 'Menunggu',
                createdAt: serverTimestamp()
            };

            try {
                const colPath = collection(db, 'artifacts', appId, 'public', 'data', 'aduan');
                await addDoc(colPath, aduanData);
                alert("Laporan Berhasil Terkirim!\nID TIKET: " + ticketId + "\n\nSimpan ID Tiket ini untuk cek status.");
                e.target.reset();
            } catch (err) {
                alert("Gagal mengirim laporan: " + err.message);
            } finally {
                btn.disabled = false;
                btn.innerText = "Kirim Laporan Sekarang";
            }
        });

        // Load Data di Dashboard Admin
        function loadAdminData() {
            const colRef = collection(db, 'artifacts', appId, 'public', 'data', 'aduan');
            onSnapshot(colRef, (snap) => {
                const tbody = document.getElementById('adminTableBody');
                tbody.innerHTML = '';
                snap.forEach(d => {
                    const item = d.data();
                    const tr = document.createElement('tr');
                    tr.className = "border-b border-white/5 hover:bg-white/5";
                    tr.innerHTML = `
                        <td class="px-6 py-4 font-mono text-sky-400 font-bold">${item.ticketId}</td>
                        <td class="px-6 py-4"><b>${item.nama}</b><br><span class="text-xs text-slate-500">${item.hp}</span></td>
                        <td class="px-6 py-4 text-sm">${item.satker}</td>
                        <td class="px-6 py-4">
                            <select onchange="updateStatus('${d.id}', this.value)" class="bg-slate-800 text-xs rounded border border-white/10 px-2 py-1 outline-none">
                                <option value="Menunggu" ${item.status==='Menunggu'?'selected':''}>Menunggu</option>
                                <option value="Proses" ${item.status==='Proses'?'selected':''}>Proses</option>
                                <option value="Selesai" ${item.status==='Selesai'?'selected':''}>Selesai</option>
                            </select>
                        </td>
                        <td class="px-6 py-4">
                            <button onclick="hapusAduan('${d.id}')" class="text-red-500 hover:text-red-400"><i class="fas fa-trash"></i></button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            });
        }

        // Fungsi Global untuk Aksi Admin
        window.updateStatus = async (id, newStatus) => {
            const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'aduan', id);
            await updateDoc(docRef, { status: newStatus });
            alert("Status diperbarui!");
        };

        window.hapusAduan = async (id) => {
            if (confirm("Hapus aduan ini secara permanen?")) {
                const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'aduan', id);
                await deleteDoc(docRef);
            }
        };

        // Login Admin
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('adminEmail').value;
            const pass = document.getElementById('adminPass').value;
            const btn = document.getElementById('loginBtn');

            btn.disabled = true;
            btn.innerText = "Mengecek Akun...";

            try {
                await signInWithEmailAndPassword(auth, email, pass);
                toggleModal('login-modal');
                alert("Login Berhasil!");
            } catch (err) {
                alert("Login Gagal: " + err.message + "\n\nPastikan email admin sudah didaftarkan di Firebase Console Authentication.");
            } finally {
                btn.disabled = false;
                btn.innerText = "Masuk Ke Panel";
            }
        });

        // Logout
        window.handleLogout = () => {
            signOut(auth).then(() => location.reload());
        };

        // Cek Status (Untuk Pengguna)
        window.checkTicketStatus = async () => {
            const val = document.getElementById('ticketInput').value.trim().toUpperCase();
            const res = document.getElementById('statusResult');
            if (!val) return;

            res.innerHTML = "Mencari...";
            res.classList.remove('hidden');

            try {
                const snap = await getDocs(collection(db, 'artifacts', appId, 'public', 'data', 'aduan'));
                let found = null;
                snap.forEach(d => { if (d.data().ticketId === val) found = d.data(); });

                if (found) {
                    res.innerHTML = `
                        <div class="glass p-6 rounded-2xl text-left border-sky-500/50">
                            <h4 class="font-bold text-sky-400 mb-2">${found.ticketId}</h4>
                            <p class="text-sm">Status: <span class="bg-sky-500 px-2 py-0.5 rounded text-xs font-bold">${found.status.toUpperCase()}</span></p>
                            <p class="text-xs text-slate-400 mt-4 italic">"${found.isi}"</p>
                        </div>
                    `;
                } else {
                    res.innerHTML = "<p class='text-red-400'>ID Tiket Tidak Ditemukan</p>";
                }
            } catch (err) {
                res.innerHTML = "Error memuat data.";
            }
        };
    </script>
</body>
</html>
